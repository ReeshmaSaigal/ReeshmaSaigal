<div class="container mt-4">

  <div class="card shadow rounded-4 p-4">

    <!-- Title -->
    <div class="border-bottom pb-3 mb-4">
      <h4 class="fw-bold">💼 Post Job</h4>
    </div>

    <!-- FORM -->
    <form [formGroup]="addJobForm" (ngSubmit)="onSubmit()">

      <div class="row g-4">

        <!-- LEFT SIDE -->
        <div class="col-md-6">

          <!-- Job Title -->
          <div>
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="Job Title"
                   formControlName="jobTitle"
                   [ngClass]="{'is-invalid': submitted && addJobForm.controls['jobTitle'].errors}">

            <div class="invalid-feedback"
                 *ngIf="submitted && addJobForm.controls['jobTitle'].errors">
              Job Title is required
            </div>
          </div>

          <!-- Location -->
          <div class="mt-3">
            <select class="form-select form-select-lg"
                    formControlName="locationId"
                    [ngClass]="{'is-invalid': submitted && addJobForm.controls['locationId'].errors}">
              
              <option value="">Select Location</option>
              <option *ngFor="let loc of locationName" [value]="loc.id">
                {{ loc.name }}
              </option>
            </select>

            <div class="invalid-feedback"
                 *ngIf="submitted && addJobForm.controls['locationId'].errors">
              Location is required
            </div>
          </div>

          <!-- Industry -->
          <div class="mt-3">
            <select class="form-select form-select-lg"
                    formControlName="industryId"
                    [ngClass]="{'is-invalid': submitted && addJobForm.controls['industryId'].errors}">
              
              <option value="">Select Industry</option>
              <option *ngFor="let industry of industryName" [value]="industry.id">
                {{ industry.name }}
              </option>
            </select>

            <div class="invalid-feedback"
                 *ngIf="submitted && addJobForm.controls['industryId'].errors">
              Industry is required
            </div>
          </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6">

          <!-- Category -->
          <div>
            <select class="form-select form-select-lg"
                    formControlName="categoryId"
                    [ngClass]="{'is-invalid': submitted && addJobForm.controls['categoryId'].errors}">
              
              <option value="">Select Category</option>
              <option *ngFor="let category of catogoryName" [value]="category.id">
                {{ category.name }}
              </option>
            </select>

            <div class="invalid-feedback"
                 *ngIf="submitted && addJobForm.controls['categoryId'].errors">
              Category is required
            </div>
          </div>

          <!-- Job Summary -->
          <div class="mt-3">
            <textarea class="form-control form-control-lg"
                      rows="5"
                      placeholder="Job Description"
                      formControlName="jobSummary"
                      [ngClass]="{'is-invalid': submitted && addJobForm.controls['jobSummary'].errors}">
            </textarea>

            <div class="invalid-feedback"
                 *ngIf="submitted && addJobForm.controls['jobSummary'].errors">
              Job summary is required
            </div>
          </div>

        </div>

      </div>

      <!-- BUTTON -->
      <div class="text-end mt-4">
        <button type="submit"
                class="btn btn-primary px-5 py-2">
          Post Job
        </button>
      </div>

    </form>

  </div>

</div>

<!-- ✅ SUCCESS TOAST -->
<div class="toast position-fixed bottom-0 end-0 m-3"
     [class.show]="showToast"
     style="z-index: 9999; background-color:#198754; color:white;">
  <div class="toast-body">
    ✅ Job posted successfully!
  </div>
</div>
<!-- ❌ ERROR TOAST -->
<div class="toast position-fixed bottom-0 end-0 m-3"
     [class.show]="showErrorToast"
     style="z-index: 9999; background-color:#dc3545; color:white;">
  <div class="toast-body">
    ❌ Please fill all required fields correctly!
  </div>
</div>
