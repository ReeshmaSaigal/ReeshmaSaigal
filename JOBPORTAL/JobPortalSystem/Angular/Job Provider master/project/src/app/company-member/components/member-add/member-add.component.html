<div class="container mt-4">

  <div class="card shadow rounded-4 p-4">

    <!-- Title -->
    <div class="border-bottom pb-3 mb-4 text-center">
      <h4 class="fw-bold">Add Company Member</h4>
    </div>

    <!-- FORM -->
    <form [formGroup]="companyMemberForm" (ngSubmit)="addCompanyMember()">

      <div class="row g-4">

        <!-- LEFT -->
        <div class="col-md-6">

          <!-- First Name -->
          <div>
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="First Name"
                   formControlName="firstName"
                   [ngClass]="{'is-invalid': submitted && f['firstName'].errors}">
            <div class="invalid-feedback"
                 *ngIf="submitted && f['firstName'].errors">
              First name is required
            </div>
          </div>

          <!-- Last Name -->
          <div class="mt-3">
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="Last Name"
                   formControlName="lastName"
                   [ngClass]="{'is-invalid': submitted && f['lastName'].errors}">
            <div class="invalid-feedback"
                 *ngIf="submitted && f['lastName'].errors">
              Last name is required
            </div>
          </div>

          <!-- Email -->
          <div class="mt-3">
            <input type="email"
                   class="form-control form-control-lg"
                   placeholder="Email"
                   formControlName="email"
                   [ngClass]="{'is-invalid': submitted && f['email'].errors}">
            <div class="invalid-feedback"
                 *ngIf="submitted && f['email'].errors">
              <span *ngIf="f['email'].errors?.['required']">Email is required</span>
              <span *ngIf="f['email'].errors?.['email']">Invalid email</span>
            </div>
          </div>

        </div>

        <!-- RIGHT -->
        <div class="col-md-6">

          <!-- Username -->
          <div>
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="Username"
                   formControlName="username"
                   [ngClass]="{'is-invalid': submitted && f['username'].errors}">
            <div class="invalid-feedback"
                 *ngIf="submitted && f['username'].errors">
              Username is required
            </div>
          </div>

          <!-- Password -->
          <div class="mt-3">
            <input type="password"
                   class="form-control form-control-lg"
                   placeholder="Password"
                   formControlName="password"
                   [ngClass]="{'is-invalid': submitted && f['password'].errors}">
            <div class="invalid-feedback"
                 *ngIf="submitted && f['password'].errors">
              <span *ngIf="f['password'].errors?.['required']">Password is required</span>
              <span *ngIf="f['password'].errors?.['minlength']">Minimum 6 characters</span>
            </div>
          </div>

          <!-- Phone -->
          <div class="mt-3">
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="Phone Number"
                   formControlName="phone"
                   [ngClass]="{'is-invalid': submitted && f['phone'].errors}">
            <div class="invalid-feedback"
                 *ngIf="submitted && f['phone'].errors">
              <span *ngIf="f['phone'].errors?.['required']">Phone is required</span>
              <span *ngIf="f['phone'].errors?.['pattern']">Enter valid 10-digit number</span>
            </div>
          </div>

        </div>

      </div>

      <!-- BUTTON -->
      <div class="text-end mt-4">
        <button type="submit"
                class="btn btn-primary px-5 py-2 ">
          Register
        </button>
      </div>

    </form>

  </div>

</div>

<!-- ✅ SUCCESS TOAST -->
<div class="toast position-fixed bottom-0 end-0 m-3"
     [class.show]="showSuccessToast"
     style="z-index:9999; background-color:#198754; color:white;">
  <div class="toast-body">
    ✅ Member added successfully!
  </div>
</div>

<!-- ❌ ERROR TOAST -->
<div class="toast position-fixed bottom-0 end-0 m-3"
     [class.show]="showErrorToast"
     style="z-index:9999; background-color:#dc3545; color:white;">
  <div class="toast-body">
    ❌ Please fill all fields correctly!
  </div>
</div>
