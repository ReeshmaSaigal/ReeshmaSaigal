<div class="container mt-4">

  <div class="card shadow rounded-4 p-4">

    <!-- Title -->
    <div class="border-bottom pb-3 mb-4">
      <h4 class="fw-bold">📅 Schedule Interview</h4>
    </div>

    <!-- FORM -->
    <form [formGroup]="scheduleInterviewForm" (ngSubmit)="onSubmit()">

      <div class="row g-4">

        <!-- LEFT -->
        <div class="col-md-6">

          <!-- Job Title -->
          <div>
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="Job Title"
                   formControlName="jobTitle"
                   [ngClass]="{'is-invalid': submitted && scheduleInterviewForm.controls['jobTitle'].errors}">

            <div class="invalid-feedback"
                 *ngIf="submitted && scheduleInterviewForm.controls['jobTitle'].errors">
              Job Title is required
            </div>
          </div>

          <!-- Location -->
          <div class="mt-3">
            <div class="input-group">
              <input type="text"
                     class="form-control form-control-lg"
                     placeholder="Location"
                     formControlName="location"
                     [ngClass]="{'is-invalid': submitted && scheduleInterviewForm.controls['location'].errors}">

              <span class="input-group-text">
                <i class="bi bi-geo-alt"></i>
              </span>
            </div>

            <div class="invalid-feedback d-block"
                 *ngIf="submitted && scheduleInterviewForm.controls['location'].errors">
              Location is required
            </div>
          </div>

        </div>

        <!-- RIGHT -->
        <div class="col-md-6">

          <!-- Date -->
          <div>
            <div class="input-group">
              <input type="date"
                     class="form-control form-control-lg"
                     formControlName="interviewDate"
                     [ngClass]="{'is-invalid': submitted && scheduleInterviewForm.controls['interviewDate'].errors}">

              <span class="input-group-text">
                <i class="bi bi-calendar"></i>
              </span>
            </div>

            <div class="invalid-feedback d-block"
                 *ngIf="submitted && scheduleInterviewForm.controls['interviewDate'].errors">
              Date is required
            </div>
          </div>

          <!-- Time -->
          <div class="mt-3">
            <div class="input-group">
              <input type="time"
                     class="form-control form-control-lg"
                     formControlName="interviewTime"
                     [ngClass]="{'is-invalid': submitted && scheduleInterviewForm.controls['interviewTime'].errors}">

              <span class="input-group-text">
                <i class="bi bi-clock"></i>
              </span>
            </div>

            <div class="invalid-feedback d-block"
                 *ngIf="submitted && scheduleInterviewForm.controls['interviewTime'].errors">
              Time is required
            </div>
          </div>

        </div>

      </div>

      <!-- BUTTON -->
      <div class="text-end mt-4">
        <button type="submit"
                class="btn btn-primary px-5 py-2 ">
          Send Invite
        </button>
      </div>

    </form>

  </div>

</div>

<!-- ✅ SUCCESS TOAST -->
<div class="toast position-fixed bottom-0 end-0 m-3"
     [class.show]="showSuccessToast"
     style="z-index:9999; background-color:#198754; color:white;">
  <div class="toast-body">
    ✅ Interview scheduled successfully!
  </div>
</div>

<!-- ❌ ERROR TOAST -->
<div class="toast position-fixed bottom-0 end-0 m-3"
     [class.show]="showErrorToast"
     style="z-index:9999; background-color:#dc3545; color:white;">
  <div class="toast-body">
    ❌ Please fill all fields!
  </div>
</div>
