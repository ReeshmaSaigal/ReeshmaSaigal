<div class="container my-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Shortlisted Interviews</h4>
  </div>

  <!-- SEARCH -->
  <div class="row mb-4">
    <!-- <div class="col-md-6">
      <input class="form-control rounded-pill shadow-sm"
             type="search"
             placeholder="🔍 Search interviews...">
    </div> -->
  </div>

  <div class="row">

    <!-- LEFT SIDE (LIST) -->
    <div class="col-md-7">

      <!-- EMPTY STATE -->
      <div *ngIf="interviewList.length === 0"
           class="text-center text-muted mt-5">
        <h5>No Interviews Scheduled ❌</h5>
        <p>Schedule an interview to see it here.</p>
      </div>

      <!-- INTERVIEW LIST -->
      <div *ngFor="let list of interviewList" class="card mb-3 shadow-sm border-0">

        <div class="card-body d-flex align-items-center">

          <!-- LOGO -->
          <img src="assets/images/Interview/Company Logo.png"
               class="me-3 rounded"
               width="60"
               height="60"
               alt="company-logo">

          <!-- DETAILS -->
          <div class="flex-grow-1">

            <h5 class="mb-1 fw-semibold">
              {{ list.jobJobTitle || 'Job Title' }}
            </h5>

            <p class="mb-1 text-muted">
              📅 {{ list.date | date:'mediumDate' }}
            </p>

            <p class="mb-1 text-muted">
              🕒 {{ list.date | date:'shortTime' }}
            </p>

            <p class="mb-2 text-muted">
              👤 {{ list.jobseekerUsername }}
            </p>

          </div>

          <!-- ACTION -->
          <button class="btn btn-outline-primary btn-sm"(click)="CancelInterview(list.id)">
            Cancel
          </button>

        </div>

      </div>

    </div>

    <!-- RIGHT SIDE IMAGE -->
    <div class="col-md-5 d-none d-md-flex align-items-center">
      <img src="assets/images/Interview/nice-meeting-businessmen 1.png"
           class="img-fluid rounded shadow-sm"
           style="object-fit: cover;">
    </div>

  </div>

</div>
