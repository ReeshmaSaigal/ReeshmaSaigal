<section class="py-5 bg-light">

  <div class="container">
    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="text-center mb-4">
          <h2 class="fw-bold">Apply for Job</h2>
          <p class="text-muted">Choose profile & resume to apply</p>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4">

            <form #uploadCV="ngForm" (ngSubmit)="onSubmit(uploadCV)">

              <!-- SELECT PROFILE -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Select Profile</label>

                <select class="form-select"
                        name="profileId"
                        ngModel
                        required
                        (change)="onProfileChange($event)">

                  <option value="">Select Profile</option>

                  <option *ngFor="let p of profiles"
                          [value]="p.id">
                    {{ p.profileName }}
                  </option>

                </select>
              </div>

              <!-- SELECT RESUME -->
              <div class="mb-4">
                <label class="form-label fw-semibold">Select Resume</label>

                <select class="form-select"
                        name="selectedOption"
                        ngModel
                        required>

                  <option value="">Select Resume</option>

                  <option *ngFor="let item of dropdownData"
                          [value]="item.id">
                    {{ item.title }}
                  </option>

                </select>
              </div>

              <!-- COVER LETTER -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Cover Letter</label>
                <textarea class="form-control"
                          rows="3"
                          name="coverLetter"
                          ngModel></textarea>
              </div>

              <!-- OPTIONAL FILE UPLOAD -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Upload New Resume (Optional)</label>

                <input type="file"
                       class="form-control"
                       (change)="onFileChange($event)">
              </div>

              <!-- BUTTON -->
              <div class="d-grid">
                <button type="submit"
                        class="btn btn-primary btn-lg rounded-3">
                  Apply Now
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>

    </div>
  </div>

</section>
