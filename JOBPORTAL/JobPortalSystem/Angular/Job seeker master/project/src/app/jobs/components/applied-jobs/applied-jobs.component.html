<div class="container">
  <div class="row">

    <!-- LEFT SIDE -->
    <div class="col-md-6">

      <div class="myApplications">
        <h4 class="p-3">My Applications</h4>
      </div>

      <ng-container *ngFor="let appliedJob of appliedJobList">

        <div class="card shadow-sm mb-3">

          <div class="card-body">

            <!-- HEADER -->
            <div class="d-flex align-items-center">
              <img src="../assets/images/Rectangle 14.png" width="50" height="50">
              
              <div class="ms-3">
                <h5 class="mb-1">{{appliedJob?.jobPostJobTitle}}</h5>
                <small class="text-primary">
                  • {{appliedJob?.jobPostCompanyLegalName}}
                </small>
              </div>
            </div>

            <!-- DESCRIPTION -->
            <p class="mt-3 mb-2">
              {{appliedJob?.jobPostJobSummary}}
            </p>

            <!-- STATUS -->
            <span class="badge"
                  [ngClass]="{
                    'bg-warning': appliedJob?.status === 'Pending',
                    'bg-success': appliedJob?.status === 'Approved',
                    'bg-danger': appliedJob?.status === 'Rejected'
                  }">
              {{ appliedJob?.status || 'Pending' }}
            </span>

            <!-- ACTION -->
            <div class="mt-3">
              <button class="btn btn-outline-danger btn-sm"
                      (click)="deleteJob(appliedJob?.id)">
                <i class="fa-solid fa-trash"></i> Cancel
              </button>
            </div>

          </div>

        </div>

      </ng-container>

    </div>

    <!-- RIGHT SIDE -->
    <div class="col-md-6 d-flex justify-content-center align-items-center">

      <div class="text-center">
        <h3>Application Status</h3>
        <p class="text-muted">
          Select a job to view detailed status (coming soon 🚀)
        </p>
      </div>

    </div>

  </div>
</div>
