<div class="container mt-5">
  <div class="row justify-content-center">

    <div class="col-md-5">

      <!-- Title -->
      <h3 class="text-center text-primary mb-4">
        <i class="fas fa-user-plus"></i> Sign Up
      </h3>

      <!-- Error -->
      <div *ngIf="error" class="alert alert-danger text-center">
        {{ error }}
      </div>

      <!-- Form -->
      <form #regForm="ngForm" (ngSubmit)="signUp(regForm)">

        <!-- First Name -->
        <div class="mb-3">
          <input type="text"
                 class="form-control"
                 name="firstName"
                 placeholder="First Name"
                 ngModel
                 required>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
          <input type="text"
                 class="form-control"
                 name="lastName"
                 placeholder="Last Name"
                 ngModel>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <input type="text"
                 class="form-control"
                 name="userName"
                 placeholder="Username"
                 ngModel
                 required>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <input type="email"
                 class="form-control"
                 name="email"
                 placeholder="Email"
                 ngModel
                 required>
        </div>

        <!-- Phone -->
        <div class="mb-4">
          <input type="text"
                 class="form-control"
                 name="phone"
                 placeholder="Phone"
                 ngModel>
        </div>

        <!-- Button -->
        <button type="submit"
                class="btn btn-primary w-100"
                [disabled]="regForm.invalid || isLoading">

          <span *ngIf="!isLoading">
            Sign Up
          </span>

          <span *ngIf="isLoading">
            Processing...
          </span>

        </button>

      </form>

      <!-- Spinner -->
      <div class="text-center mt-3" *ngIf="isLoading">
        <app-spinner></app-spinner>
      </div>

    </div>

  </div>
</div>
