<div class="container" *ngIf="emailVerified">
  <div class="row justify-content-center align-items-center">

    <div class="col-md-5">

      <div class="p-4 shadow rounded bg-white">

        <!-- Image -->
        <div class="text-center mb-3">
          <img src="../../../../../assets/images/img1.jpg"
               class="img-fluid rounded-circle"
               style="max-width: 150px;">
        </div>

        <!-- Title -->
        <h4 class="text-center mb-4 text-primary">
          Set Your Password
        </h4>

        <!-- Form -->
        <form #passwordForm="ngForm" (ngSubmit)="submitForm(passwordForm)">

          <!-- Password -->
          <div class="mb-3">
            <label>Password</label>

            <input type="password"
                   class="form-control"
                   name="password"
                   [(ngModel)]="user.password"
                   #passwordControl="ngModel"
                   required
                   minlength="8" />

            <div *ngIf="passwordControl.invalid && (passwordControl.dirty || passwordControl.touched)">
              <small class="text-danger" *ngIf="passwordControl.hasError('required')">
                Password is required
              </small>
              <small class="text-danger" *ngIf="passwordControl.hasError('minlength')">
                Minimum 8 characters required
              </small>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label>Confirm Password</label>

            <input type="password"
                   class="form-control"
                   name="confirmPassword"
                   [(ngModel)]="user.confirmPassword"
                   #confirmPasswordControl="ngModel"
                   (ngModelChange)="checkPasswordMatch()"
                   required />

            <div *ngIf="confirmPasswordControl.invalid && (confirmPasswordControl.dirty || confirmPasswordControl.touched)">
              <small class="text-danger" *ngIf="confirmPasswordControl.hasError('required')">
                Confirm password is required
              </small>
            </div>
          </div>

          <!-- Mismatch -->
          <div *ngIf="passwordMismatch" class="text-danger text-center mb-2">
            Passwords do not match
          </div>

          <!-- Button -->
          <button type="submit"
                  class="btn btn-primary w-100"
                  [disabled]="passwordForm.invalid || passwordMismatch">

            Submit
          </button>

        </form>

      </div>

    </div>

  </div>
</div>

<!-- Spinner -->
<div *ngIf="!emailVerified" class="text-center mt-5">
  <app-spinner></app-spinner>
</div>
